# GENERATED by generate.py from projects.json. Edit projects.json, not this file.
name: ml-dev-workspace

services:

  # Shared services ###################################################
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: ml-dev-workspace-mlflow
    ports:
      - "5050:5000"
    volumes:
      - mlruns:/mlruns
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ml-network

  postgres:
    image: postgres:16-alpine
    container_name: ml-dev-workspace-postgres
    environment:
      - POSTGRES_DB=production_prediction
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d production_prediction"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - ml-network

  # Production-Prediction-ML ##########################################
  ppml:
    build:
      context: ../Production-Prediction-ML
      dockerfile: Dockerfile
    container_name: ml-dev-workspace-ppml
    volumes:
      - ../Production-Prediction-ML:/workspace
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=production_prediction
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - AZURE_SUBSCRIPTION_ID=${AZURE_SUBSCRIPTION_ID:-}
      - AZURE_RESOURCE_GROUP=${AZURE_RESOURCE_GROUP:-}
      - AZURE_ML_WORKSPACE=${AZURE_ML_WORKSPACE:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
    restart: "no"
    networks:
      - ml-network

  ppml-api:
    build:
      context: ../Production-Prediction-ML
      dockerfile: Dockerfile
    container_name: ml-dev-workspace-ppml-api
    command: uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ../Production-Prediction-ML:/workspace
    ports:
      - "8100:8000"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=production_prediction
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - AZURE_SUBSCRIPTION_ID=${AZURE_SUBSCRIPTION_ID:-}
      - AZURE_RESOURCE_GROUP=${AZURE_RESOURCE_GROUP:-}
      - AZURE_ML_WORKSPACE=${AZURE_ML_WORKSPACE:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 8g
    restart: unless-stopped
    networks:
      - ml-network

  # 3D-Petrophysical-Prediction-ML ####################################
  petro:
    build:
      context: ../3D-Petrophysical-Prediction-ML
      dockerfile: Dockerfile
    container_name: ml-dev-workspace-petro
    volumes:
      - ../3D-Petrophysical-Prediction-ML:/workspace
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/workspace/rockPropCalculator
    depends_on:
      mlflow:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    restart: "no"
    networks:
      - ml-network

  petro-api:
    build:
      context: ../3D-Petrophysical-Prediction-ML
      dockerfile: Dockerfile
    container_name: ml-dev-workspace-petro-api
    command: uvicorn api:app --host 0.0.0.0 --port 8001 --reload
    volumes:
      - ../3D-Petrophysical-Prediction-ML:/workspace
    ports:
      - "8101:8001"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/workspace/rockPropCalculator
    depends_on:
      mlflow:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    restart: unless-stopped
    networks:
      - ml-network

  # Weather-Forecasting-ML ############################################
  weather:
    build:
      context: ../Weather-Forecasting-ML
      dockerfile: Dockerfile
    container_name: ml-dev-workspace-weather
    volumes:
      - ../Weather-Forecasting-ML:/workspace
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/workspace/weatherForcastingCalculator
    depends_on:
      mlflow:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    restart: "no"
    networks:
      - ml-network

  weather-api:
    build:
      context: ../Weather-Forecasting-ML
      dockerfile: Dockerfile
    container_name: ml-dev-workspace-weather-api
    command: uvicorn api:app --host 0.0.0.0 --port 8002 --reload
    volumes:
      - ../Weather-Forecasting-ML:/workspace
    ports:
      - "8102:8002"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/workspace/weatherForcastingCalculator
    depends_on:
      mlflow:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    restart: unless-stopped
    networks:
      - ml-network

  # Point-Cloud-ML ####################################################
  pointcloud:
    build:
      context: ../Point-Cloud-ML
      dockerfile: Dockerfile
    container_name: ml-dev-workspace-pointcloud
    volumes:
      - ../Point-Cloud-ML:/workspace
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/workspace/pointCloudMLCalculator
    depends_on:
      mlflow:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    restart: "no"
    networks:
      - ml-network

  pointcloud-api:
    build:
      context: ../Point-Cloud-ML
      dockerfile: Dockerfile
    container_name: ml-dev-workspace-pointcloud-api
    command: uvicorn api:app --host 0.0.0.0 --port 8003 --reload
    volumes:
      - ../Point-Cloud-ML:/workspace
    ports:
      - "8103:8003"
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/workspace/pointCloudMLCalculator
    depends_on:
      mlflow:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g
    restart: unless-stopped
    networks:
      - ml-network

  # UI ###############################################################
  ui:
    image: node:20-slim
    container_name: ml-dev-workspace-ui
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    volumes:
      - ../ML-Platform-UI:/app
      - ./calculators.json:/config/calculators.json:ro
      - ui_node_modules:/app/node_modules
    environment:
      - CALCULATORS_FILE=/config/calculators.json
      - IN_DOCKER=1
    ports:
      - "5173:5173"
    restart: unless-stopped
    networks:
      - ml-network

volumes:
  mlruns:
  pgdata:
  ui_node_modules:

networks:
  ml-network:
    driver: bridge
